# ANCHORS MS33 Model VII — free-swelling cylinder.
#
# Mesh: ANCHORS_MS33_ModelVII/ms33_cylinder_r25_h70.vtu, axisymmetric.
#
# Geometry (transcribed from ms33_modelVII_freeswelling.prj line 8):
#   Cylinder (MaterialID=0): r ∈ [0, 0.025] m, z ∈ [0, 0.070] m
#   Right face (r=0.025) is FREE (u_r unconstrained) — no radial confinement.
#
# Stress convention: same as Model I (BishopsSaturationCutoff cutoff=1
# → σ_eff ≡ σ_total numerically). Under unconfined conditions and with χ ≡ 0
# on the unsaturated branch, the "net stress" σ̄_net of the bentonite-mechanics
# literature (σ_total − u_a, with u_a = 0 in OGS) is identical to σ̄ from the
# `sigma` VTU field. CSV column labeled mean_stress_MPa.

model: VII
mesh: ms33_cylinder_r25_h70.vtu     # OGS snapshots omit MaterialIDs; loaded from this file alongside the PVD
description: |
  Free-swelling cylinder with no radial confinement. Story: lateral free
  expansion under hydration, densification trajectory in the e–σ_net plane.

material_ids:
  0: { name: bentonite }
zones:
  - { id: bentonite, material_id: 0, aggregation: [volume_avg, centroid] }

triptych:
  fields:
    - { panel: pressure,         source: pressure,        reduction: identity,         unit: MPa,  scale: -1.0e-6 }
    - { panel: displacement_mag, source: displacement,    reduction: vector_magnitude, unit: mm,   scale: 1.0e3   }
    - { panel: swelling_stress,  source: swelling_stress, reduction: mean_compressive, unit: MPa,  scale: 1.0e-6  }
  layout: horizontal
  time: final
  axis_labels: { x: "r [m]", y: "z [m]" }

time_series:
  - { key: suction,              field: pressure,         reduction: mean,             unit: MPa,    scale: -1.0e-6, per_zone: false }
  - { key: mean_stress,          field: sigma,            reduction: mean_compressive, unit: MPa,    scale:  1.0e-6, per_zone: true  }
  - { key: mean_swelling_stress, field: swelling_stress,  reduction: mean_compressive, unit: MPa,    scale:  1.0e-6, per_zone: true  }
  - { key: dry_density,          field: dry_density_solid, reduction: mean,            unit: kg/m^3, scale: 1.0,     per_zone: true  }
  - { key: saturation,           field: saturation,       reduction: mean,             unit: "-",    scale: 1.0,     per_zone: true  }
  - { key: porosity,             field: porosity,         reduction: mean,             unit: "-",    scale: 1.0,     per_zone: true  }
  - { key: void_ratio,           field: porosity,         reduction: void_ratio_mean,  unit: "-",    scale: 1.0,     per_zone: true }
  # void_ratio_mean reduction = volume-avg(φ/(1-φ)); computed from `porosity` field.

markers_days: [20, 100, 200]

figures:
  - { key: mean_stress,         xaxis: time_days,                          yaxis: mean_stress_bentonite_volavg_MPa,       title: "Model VII — Mean stress" }
  - { key: ps_path,             xaxis: suction_MPa,                        yaxis: mean_stress_bentonite_volavg_MPa,       title: "Model VII — p–s path" }
  - { key: void_ratio_stress,   xaxis: mean_stress_bentonite_volavg_MPa,   yaxis: void_ratio_bentonite_volavg,            title: "Model VII — e vs σ_net" }
